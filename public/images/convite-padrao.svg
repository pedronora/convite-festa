<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Convite do aniversário de Luigi e Marco Antonio</title>
  <desc id="desc">Convite temático de super-heróis para comemorar os 3 anos de Luigi e o 1 ano de Marco Antonio, no dia 23 de janeiro às 15h, no Recanto Família Fernandes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="0.55" stop-color="#12305c"/>
      <stop offset="1" stop-color="#0a1730"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef3b4b"/>
      <stop offset="0.6" stop-color="#c81e2b"/>
      <stop offset="1" stop-color="#8e1120"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#f6c445"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.2" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <pattern id="dotsDark" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#0b1d3a" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="1500" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="1500" fill="url(#bg)"/>
    <rect width="1200" height="1500" fill="url(#dots)"/>

    <!-- teias -->
    <g stroke="#bfe6ff" stroke-opacity="0.32" fill="none" stroke-width="2">
      <path d="M0 0 L360 360 M0 120 L330 390 M0 240 L300 420 M0 360 L270 450 M0 480 L240 480"/>
      <path d="M95 0 Q120 210 330 240 M230 0 Q240 160 390 175 M60 150 Q95 260 260 285"/>
      <path d="M1200 0 L840 360 M1200 120 L870 390 M1200 240 L900 420 M1200 360 L930 450 M1200 480 L960 480"/>
      <path d="M1105 0 Q1080 210 870 240 M970 0 Q960 160 810 175 M1140 150 Q1105 260 940 285"/>
      <path d="M0 1500 L330 1170 M0 1380 L300 1050 M120 1500 L360 1140"/>
      <path d="M1200 1500 L870 1170 M1200 1380 L900 1050 M1080 1500 L840 1140"/>
    </g>

    <!-- faixa vermelha -->
    <path d="M-60 170 L1260 40 L1260 520 L-60 640 Z" fill="url(#red)"/>
    <path d="M-60 170 L1260 40 L1260 520 L-60 640 Z" fill="url(#dotsDark)"/>

    <!-- emblema -->
    <g transform="translate(600 180)">
      <path d="M-96 0 C-96 -86 -42 -128 0 -128 C42 -128 96 -86 96 0 C96 96 26 146 0 160 C-26 146 -96 96 -96 0 Z" fill="#0b1d3a" stroke="#ffffff" stroke-width="8"/>
      <path d="M-92 4 C-84 -52 -46 -92 0 -96 C46 -92 84 -52 92 4 C92 78 30 120 0 134 C-30 120 -92 78 -92 4 Z" fill="url(#red)"/>
      <path d="M-66 -20 C-58 -56 -30 -72 0 -74 C30 -72 58 -56 66 -20 C50 -8 30 -2 0 -2 C-30 -2 -50 -8 -66 -20 Z" fill="#ffffff"/>
      <path d="M-50 -22 C-40 -10 -24 -4 0 -4 C24 -4 40 -10 50 -22 C40 -46 22 -58 0 -60 C-22 -58 -40 -46 -50 -22 Z" fill="#0b1d3a"/>
      <path d="M-46 -32 C-38 -20 -22 -14 0 -14 C4 -24 8 -32 10 -38 C-4 -42 -26 -40 -46 -32 Z" fill="#eaf6ff"/>
      <path d="M46 -32 C38 -20 22 -14 0 -14 C-4 -24 -8 -32 -10 -38 C4 -42 26 -40 46 -32 Z" fill="#eaf6ff"/>
    </g>

    <text x="600" y="390" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="900" letter-spacing="8" fill="#dff2ff">UMA AVENTURA DE SUPER-HERÓIS</text>

    <!-- Luigi -->
    <g transform="translate(0 470)">
      <path d="M600 0 L682 58 L650 150 L550 150 L518 58 Z" fill="none"/>
      <text x="600" y="128" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="186" fill="#ffffff" stroke="#0b1d3a" stroke-width="14" paint-order="stroke" letter-spacing="4">LUIGI</text>
      <g transform="translate(600 200)">
        <path d="M-150 10 L-108 -46 L-20 -34 L30 -78 L96 -40 L160 -26 L130 38 L54 32 L4 66 L-64 36 Z" fill="url(#yellow)" stroke="#0b1d3a" stroke-width="7"/>
        <text x="0" y="36" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="62" fill="#0b1d3a" letter-spacing="2">3 ANOS</text>
      </g>
    </g>

    <text x="600" y="790" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="78" fill="#7dd3fc" letter-spacing="6">E</text>

    <!-- Marco Antonio -->
    <g transform="translate(0 860)">
      <text x="600" y="105" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="120" fill="#ffffff" stroke="#0b1d3a" stroke-width="12" paint-order="stroke" letter-spacing="3">MARCO ANTONIO</text>
      <g transform="translate(600 178)">
        <path d="M-128 8 L-90 -38 L-14 -28 L28 -66 L84 -32 L138 -20 L112 34 L44 28 L0 56 L-56 30 Z" fill="#7dd3fc" stroke="#0b1d3a" stroke-width="6"/>
        <text x="0" y="32" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="54" fill="#0b1d3a" letter-spacing="2">1 ANINHO</text>
      </g>
    </g>

    <!-- balões -->
    <g>
      <g transform="translate(140 760)">
        <path d="M0 96 C-4 160 18 190 4 250" stroke="#dbeafe" stroke-width="3" fill="none"/>
        <ellipse cx="0" cy="26" rx="62" ry="76" fill="url(#red)" stroke="#0b1d3a" stroke-width="6"/>
        <path d="M-16 100 L0 118 L16 100 Z" fill="#a51622" stroke="#0b1d3a" stroke-width="4"/>
        <ellipse cx="-22" cy="-8" rx="14" ry="22" fill="#ffffff" opacity="0.28"/>
        <path d="M-90 10 L-20 44 M-92 40 L-20 54" stroke="#dbeafe" stroke-width="2" opacity="0.6"/>
      </g>
      <g transform="translate(1050 660)">
        <path d="M0 96 C8 160 -14 206 0 260" stroke="#dbeafe" stroke-width="3" fill="none"/>
        <ellipse cx="0" cy="26" rx="58" ry="72" fill="#38bdf8" stroke="#0b1d3a" stroke-width="6"/>
        <path d="M-15 94 L0 112 L15 94 Z" fill="#0b6ea8" stroke="#0b1d3a" stroke-width="4"/>
        <ellipse cx="-20" cy="-8" rx="12" ry="20" fill="#ffffff" opacity="0.3"/>
      </g>
    </g>

    <!-- skyline -->
    <g>
      <path d="M0 1190 L0 1080 L70 1080 L70 1130 L140 1130 L140 1040 L210 1040 L210 1150 L270 1150 L270 1100 L340 1100 L340 1180 L410 1180 L410 1070 L480 1070 L480 1120 L550 1120 L550 1020 L620 1020 L620 1160 L680 1160 L680 1090 L750 1090 L750 1180 L820 1180 L820 1060 L890 1060 L890 1130 L960 1130 L960 1040 L1030 1040 L1030 1170 L1100 1170 L1100 1100 L1160 1100 L1160 1180 L1200 1180 L1200 1500 L0 1500 Z" fill="#071427"/>
      <g fill="#fde68a" opacity="0.75">
        <rect x="160" y="1080" width="16" height="12"/><rect x="188" y="1108" width="16" height="12"/>
        <rect x="430" y="1108" width="16" height="12"/><rect x="458" y="1136" width="16" height="12"/>
        <rect x="570" y="1060" width="16" height="12"/><rect x="598" y="1088" width="16" height="12"/>
        <rect x="840" y="1100" width="16" height="12"/><rect x="868" y="1128" width="16" height="12"/>
        <rect x="980" y="1080" width="16" height="12"/><rect x="1008" y="1108" width="16" height="12"/>
      </g>
      <g fill="#7dd3fc" opacity="0.28">
        <rect x="120" y="1150" width="14" height="10"/><rect x="300" y="1150" width="14" height="10"/>
        <rect x="680" y="1120" width="14" height="10"/><rect x="1120" y="1150" width="14" height="10"/>
      </g>
    </g>

    <!-- painel de informações -->
    <g transform="translate(120 1240)">
      <rect x="0" y="0" width="960" height="230" rx="34" fill="#fffdf8"/>
      <rect x="0" y="0" width="960" height="230" rx="34" fill="none" stroke="#c81e2b" stroke-width="7" stroke-dasharray="18 10"/>
      <text x="480" y="62" text-anchor="middle" font-family="Bangers, Impact, sans-serif" font-size="50" fill="#c81e2b" letter-spacing="3">23 DE JANEIRO • 15H</text>
      <text x="480" y="118" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="32" font-weight="900" fill="#0f2447">RECANTO FAMÍLIA FERNANDES</text>
      <text x="480" y="158" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="24" font-weight="700" fill="#3d5a82">Rua Ernani Inocêncio de Medeiros, 380</text>
      <text x="480" y="194" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="24" font-weight="700" fill="#3d5a82">Santos Dumont • Cascavel — PR</text>
      <circle cx="70" cy="115" r="26" fill="#c81e2b"/>
      <path d="M58 115 L66 123 L83 105" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="890" cy="115" r="26" fill="#38bdf8"/>
      <path d="M890 103 L890 127 M878 115 L902 115" stroke="#0b1d3a" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
