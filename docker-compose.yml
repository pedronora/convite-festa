name: convite-festa

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-convite_festa}
      POSTGRES_USER: ${POSTGRES_USER:-convite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - convite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-convite} -d ${POSTGRES_DB:-convite_festa}']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-convite}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-convite_festa}
      NUXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      DATA_DIR: /app/data
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      # APP_BIND=127.0.0.1 restringe o acesso ao host local; use 0.0.0.0
      # somente quando o proxy reverso estiver em outra máquina.
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000'
    volumes:
      - convite_uploads:/app/data

volumes:
  convite_pgdata:
  convite_uploads:
